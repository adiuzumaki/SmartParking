<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Parking System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Smart Parking Availability</h2>
    <div id="map"></div>

    <script>
        let map;

        function initMap() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const userLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    map = new google.maps.Map(document.getElementById("map"), {
                        center: userLocation,
                        zoom: 15
                    });

                    new google.maps.Marker({
                        position: userLocation,
                        map: map,
                        title: "Your Location"
                    });

                    fetch("/get_parking_spots")
                        .then(res => res.json())
                        .then(data => {
                            data.spots.forEach(spot => {
                                new google.maps.Marker({
                                    position: { lat: spot.latitude, lng: spot.longitude },
                                    map: map,
                                    icon: spot.availability === "available"
                                        ? "http://maps.google.com/mapfiles/ms/icons/green-dot.png"
                                        : "http://maps.google.com/mapfiles/ms/icons/red-dot.png",
                                    title: `Spot ID: ${spot.id}`
                                });
                            });
                        });
                }, () => alert("Failed to get location."));
            } else {
                alert("Geolocation not supported.");
            }
        }
    </script>

    <script async defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDMDpa1AJoEAWLsjJ341_vOZsak7bCkx4M&callback=initMap">
    </script>
</body>
</html>
